    package com.hiro.client.module;

    import net.minecraft.client.Minecraft;
    import net.minecraft.core.BlockPos;
    import net.minecraft.core.Direction;
    import net.minecraft.network.chat.Component;
    import net.minecraft.world.InteractionHand;
    import net.minecraft.world.item.BlockItem;
    import net.minecraft.world.item.ItemStack;
    import net.minecraft.world.level.block.state.BlockState;
    import net.minecraft.world.phys.BlockHitResult;
    import net.minecraft.world.phys.Vec3;

    import java.util.ArrayList;
    import java.util.List;

    public class SchematicEngine {
        private static final List<String> PRESETS = List.of("Bunker 5x5", "Safe Pillar", "Sky Bridge");
        private int presetIndex = 0;
        private BlockPos origin = null;
        private int stepIndex = 0;
        private int cooldown = 0;
        private int totalSteps = 0;
        private String statusText = "Idle";

        public String getPreset() {
            return PRESETS.get(presetIndex);
        }

        public void setPreset(String name) {
            for (int i = 0; i < PRESETS.size(); i++) {
                if (PRESETS.get(i).equalsIgnoreCase(name)) {
                    presetIndex = i;
                    resetProgress();
                    return;
                }
            }
        }

        public void cyclePreset() {
            presetIndex = (presetIndex + 1) % PRESETS.size();
            resetProgress();
        }

        public void setOriginHere(Minecraft mc) {
            if (mc.player != null) {
                origin = mc.player.blockPosition().relative(mc.player.getDirection(), 2);
                stepIndex = 0;
                List<BlockPos> plan = buildPlan(origin);
                totalSteps = plan.size();
                statusText = "Origin set (" + totalSteps + " blocks)";
                mc.player.displayClientMessage(
                        Component.literal("§a[HIRO Schematic] §fOrigin set at §e" + origin.getX() + ", " + origin.getY() + ", " + origin.getZ() + " §7[" + getPreset() + "]"),
                        false
                );
            }
        }

        public void resetProgress() {
            stepIndex = 0;
            cooldown = 0;
            statusText = "Reset";
        }

        public String getStatusText() {
            if (totalSteps <= 0) {
                return getPreset() + ": Ready";
            }
            int pct = Math.min(100, (stepIndex * 100) / Math.max(1, totalSteps));
            return getPreset() + ": " + pct + "% (" + stepIndex + "/" + totalSteps + ")";
        }

        public void tick(Minecraft mc, boolean schematicActive, boolean builderBotActive) {
            if (mc.player == null || mc.level == null || mc.gameMode == null) {
                return;
            }
            if (!schematicActive && !builderBotActive) {
                statusText = "Idle";
                return;
            }

            if (origin == null) {
                origin = mc.player.blockPosition().relative(mc.player.getDirection(), 2);
                stepIndex = 0;
            }

            List<BlockPos> plan = buildPlan(origin);
            totalSteps = plan.size();
            if (plan.isEmpty()) {
                return;
            }

            if (cooldown > 0) {
                cooldown--;
                return;
            }

            int searched = 0;
            while (stepIndex < plan.size() && searched < 16) {
                BlockPos target = plan.get(stepIndex);
                BlockState state = mc.level.getBlockState(target);
                if (!state.canBeReplaced()) {
                    stepIndex++;
                    searched++;
                    continue;
                }

                int blockSlot = findHotbarBlockSlot(mc);
                if (blockSlot == -1) {
                    statusText = "No blocks in hotbar";
                    cooldown = 20;
                    return;
                }

                mc.player.getInventory().setSelectedSlot(blockSlot);
                Vec3 hitVec = Vec3.atCenterOf(target).add(0, -0.4, 0);
                BlockHitResult hitResult = new BlockHitResult(hitVec, Direction.UP, target, false);
                mc.gameMode.useItemOn(mc.player, InteractionHand.MAIN_HAND, hitResult);
                mc.player.swing(InteractionHand.MAIN_HAND);

                stepIndex++;
                cooldown = 3;
                statusText = getStatusText();
                return;
            }

            if (stepIndex >= plan.size()) {
                statusText = getPreset() + ": 100% Done";
            }
        }

        private int findHotbarBlockSlot(Minecraft mc) {
            for (int i = 0; i < 9; i++) {
                ItemStack stack = mc.player.getInventory().getItem(i);
                if (!stack.isEmpty() && stack.getItem() instanceof BlockItem) {
                    return i;
                }
            }
            return -1;
        }

        private List<BlockPos> buildPlan(BlockPos base) {
            List<BlockPos> blocks = new ArrayList<>();
            String preset = getPreset();

            if ("Safe Pillar".equals(preset)) {
                for (int y = 0; y < 8; y++) {
                    blocks.add(base.above(y));
                }
            } else if ("Sky Bridge".equals(preset)) {
                Direction dir = base.getX() != 0 ? Direction.NORTH : Direction.EAST;
                for (int i = 0; i < 12; i++) {
                    blocks.add(base.relative(dir, i));
                }
            } else {
                for (int dx = -2; dx <= 2; dx++) {
                    for (int dz = -2; dz <= 2; dz++) {
                        blocks.add(base.offset(dx, 0, dz));
                        boolean edge = Math.abs(dx) == 2 || Math.abs(dz) == 2;
                        if (edge) {
                            for (int dy = 1; dy <= 2; dy++) {
                                if (dz == 2 && dx == 0 && dy == 1) continue;
                                blocks.add(base.offset(dx, dy, dz));
                            }
                        }
                        blocks.add(base.offset(dx, 3, dz));
                    }
                }
            }
            return blocks;
        }
    }

project: HIRO Client
minecraft_version: 1.21.11
format_note: Single-file YAML package containing the original project files as text. Extract each value under files/ to its matching path before building; this YAML is not itself a GitHub Actions workflow.
files:
  .github/workflows/hiro-build.yml: |
    name: Build HIRO Client
    on:
      push:
      workflow_dispatch:
    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-java@v4
            with:
              distribution: temurin
              java-version: 21
          - uses: gradle/actions/setup-gradle@v4
            with:
              gradle-version: 9.3.0
          - name: Build with Gradle
            run: gradle build
          - uses: actions/upload-artifact@v4
            with:
              name: HIRO-Client-Fabric-1.21.11
              path: build/libs/*.jar
  settings.gradle: |
    pluginManagement {
        repositories {
            maven { url = 'https://maven.fabricmc.net/' }
            gradlePluginPortal()
            mavenCentral()
        }
    }

    rootProject.name = 'HIRO-Client'
  gradle.properties: |
    org.gradle.jvmargs=-Xmx2G
    org.gradle.parallel=true

    minecraft_version=1.21.11
    loader_version=0.18.4
    fabric_api_version=0.141.1+1.21.11
    loom_version=1.15.5

    mod_version=2.0.0
    maven_group=com.hiro
    archives_base_name=hiroclient
  build.gradle: |
    plugins {
        id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
        id 'maven-publish'
    }

    version = project.mod_version
    group = project.maven_group

    base {
        archivesName = project.archives_base_name
    }

    dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    }

    processResources {
        inputs.property "version", project.version
        filesMatching("fabric.mod.json") {
            expand "version": project.version
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    package com.hiro.client.module;

    import net.minecraft.client.Minecraft;
    import net.minecraft.core.BlockPos;
    import net.minecraft.core.Direction;
    import net.minecraft.world.InteractionHand;
    import net.minecraft.world.entity.Entity;
    import net.minecraft.world.entity.LivingEntity;
    import net.minecraft.world.entity.npc.villager.Villager;
    import net.minecraft.world.item.ArmorItem;
    import net.minecraft.world.item.AxeItem;
    import net.minecraft.world.item.ItemStack;
    import net.minecraft.world.item.Items;
    import net.minecraft.world.item.PickaxeItem;
    import net.minecraft.world.item.ShieldItem;
    import net.minecraft.world.item.SwordItem;
    import net.minecraft.world.level.block.Block;
    import net.minecraft.world.level.block.Blocks;
    import net.minecraft.world.level.block.state.BlockState;
    import net.minecraft.world.phys.BlockHitResult;
    import net.minecraft.world.phys.Vec3;

    public class CombatAndBotEngine {
        private int actionCooldown = 0;
        private String botStatus = "Standby";

        public String getBotStatus() {
            return botStatus;
        }

        public void tick(Minecraft mc, ModuleManager manager) {
            if (mc.player == null || mc.level == null || mc.gameMode == null) {
                return;
            }

            if (actionCooldown > 0) {
                actionCooldown--;
            }

            if (manager.isEnabled("Auto Armor")) {
                equipBestArmor(mc);
            }

            if (manager.isEnabled("Auto Eat") && mc.player.getFoodData().needsFood()) {
                eatFood(mc);
            }

            if (manager.isEnabled("Auto Shield")) {
                handleAutoShield(mc);
            }

            if (manager.isEnabled("Kill Aura") || manager.isEnabled("Sword PvP") || manager.isEnabled("Mace PvP")) {
                runCombatAttack(mc, manager);
            }

            if (manager.isEnabled("Safe Anchor")) {
                handleSafeAnchor(mc);
            }

            if (manager.isEnabled("Miner Bot") || manager.isEnabled("Area Miner") || manager.isEnabled("Auto Ore Miner")) {
                runMinerBot(mc, manager.isEnabled("Auto Ore Miner"));
            } else if (manager.isEnabled("Tree Farm Bot") || manager.isEnabled("Tree Farmer")) {
                runTreeBot(mc);
            } else if (manager.isEnabled("Trader Bot") || manager.isEnabled("Villager Trader")) {
                runTraderBot(mc);
            } else if (manager.isEnabled("Elytra Scout Bot") || manager.isEnabled("Elytra Pilot")) {
                runElytraBot(mc);
            } else if (manager.isEnabled("Crystal PvP Bot") || manager.isEnabled("Sword PvP Bot") || manager.isEnabled("Mace PvP Bot")) {
                botStatus = "Combat Bot Active";
            } else {
                botStatus = "Standby";
            }
        }

        private void equipBestArmor(Minecraft mc) {
            for (int slot = 0; slot < 9; slot++) {
                ItemStack stack = mc.player.getInventory().getItem(slot);
                if (!stack.isEmpty() && stack.getItem() instanceof ArmorItem) {
                    mc.player.getInventory().setSelectedSlot(slot);
                    mc.gameMode.useItem(mc.player, InteractionHand.MAIN_HAND);
                }
            }
        }

        private void eatFood(Minecraft mc) {
            int foodSlot = -1;
            for (int i = 0; i < 9; i++) {
                ItemStack stack = mc.player.getInventory().getItem(i);
                if (!stack.isEmpty() && stack.getFoodProperties(mc.player) != null) {
                    foodSlot = i;
                    break;
                }
            }
            if (foodSlot != -1) {
                mc.player.getInventory().setSelectedSlot(foodSlot);
                mc.options.keyUse.setDown(true);
            }
        }

        private void handleAutoShield(Minecraft mc) {
            LivingEntity threat = findNearestLiving(mc, 4.5);
            boolean shouldBlock = threat != null && mc.player.getHealth() < 14.0f;
            if (shouldBlock) {
                for (int i = 0; i < 9; i++) {
                    if (mc.player.getInventory().getItem(i).getItem() instanceof ShieldItem) {
                        mc.player.getInventory().setSelectedSlot(i);
                        mc.options.keyUse.setDown(true);
                        return;
                    }
                }
            }
            if (!mc.player.getFoodData().needsFood()) {
                mc.options.keyUse.setDown(false);
            }
        }

        private void runCombatAttack(Minecraft mc, ModuleManager manager) {
            LivingEntity target = findNearestLiving(mc, 4.5);
            if (target == null) return;

            if (manager.isEnabled("Mace PvP")) {
                selectSlotMatching(mc, stack -> stack.is(Items.MACE));
            } else if (manager.isEnabled("Sword PvP") || manager.isEnabled("Kill Aura")) {
                selectSlotMatching(mc, stack -> stack.getItem() instanceof SwordItem);
            }

            boolean canCrit = !manager.isEnabled("Criticals Helper") || !mc.player.onGround() || mc.player.fallDistance > 0.0f;
            if (mc.player.getAttackStrengthScale(0.5f) >= 0.94f && canCrit) {
                mc.gameMode.attack(mc.player, target);
                mc.player.swing(InteractionHand.MAIN_HAND);
            }
        }

        private void handleSafeAnchor(Minecraft mc) {
            if (actionCooldown > 0) return;
            BlockPos front = mc.player.blockPosition().relative(mc.player.getDirection(), 2);
            BlockState current = mc.level.getBlockState(front);
            if (current.canBeReplaced()) {
                if (selectSlotMatching(mc, stack -> stack.is(Items.RESPAWN_ANCHOR))) {
                    mc.gameMode.useItemOn(mc.player, InteractionHand.MAIN_HAND,
                            new BlockHitResult(Vec3.atCenterOf(front), Direction.UP, front, false));
                    mc.player.swing(InteractionHand.MAIN_HAND);
                    actionCooldown = 4;
                }
            } else if (current.is(Blocks.RESPAWN_ANCHOR)) {
                if (selectSlotMatching(mc, stack -> stack.is(Items.GLOWSTONE))) {
                    mc.gameMode.useItemOn(mc.player, InteractionHand.MAIN_HAND,
                            new BlockHitResult(Vec3.atCenterOf(front), Direction.UP, front, false));
                    mc.player.swing(InteractionHand.MAIN_HAND);
                    actionCooldown = 4;
                }
            }
        }

        private void runMinerBot(Minecraft mc, boolean oresOnly) {
            botStatus = oresOnly ? "Ore Miner Active" : "Area Miner Active";
            BlockPos origin = mc.player.blockPosition();
            for (int dy = 1; dy >= -2; dy--) {
                for (int dx = -2; dx <= 2; dx++) {
                    for (int dz = -2; dz <= 2; dz++) {
                        BlockPos pos = origin.offset(dx, dy, dz);
                        BlockState state = mc.level.getBlockState(pos);
                        if (state.isAir() || state.getDestroySpeed(mc.level, pos) < 0) continue;
                        if (oresOnly && !isOre(state.getBlock())) continue;
                        if (!oresOnly && dy == -1 && dx == 0 && dz == 0) continue;

                        selectSlotMatching(mc, stack -> stack.getItem() instanceof PickaxeItem);
                        mc.gameMode.continueDestroyBlock(pos, Direction.UP);
                        mc.player.swing(InteractionHand.MAIN_HAND);
                        return;
                    }
                }
            }
        }

        private void runTreeBot(Minecraft mc) {
            botStatus = "Tree Bot Active";
            BlockPos origin = mc.player.blockPosition();
            for (int dx = -3; dx <= 3; dx++) {
                for (int dz = -3; dz <= 3; dz++) {
                    for (int dy = 0; dy <= 5; dy++) {
                        BlockPos pos = origin.offset(dx, dy, dz);
                        BlockState state = mc.level.getBlockState(pos);
                        if (isLog(state.getBlock())) {
                            selectSlotMatching(mc, stack -> stack.getItem() instanceof AxeItem);
                            mc.gameMode.continueDestroyBlock(pos, Direction.UP);
                            mc.player.swing(InteractionHand.MAIN_HAND);
                            return;
                        }
                    }
                }
            }
        }

        private void runTraderBot(Minecraft mc) {
            botStatus = "Trader Bot Active";
            if (actionCooldown > 0) return;
            for (Entity e : mc.level.entitiesForRendering()) {
                if (e instanceof Villager villager && villager.isAlive() && mc.player.distanceTo(villager) < 4.0) {
                    mc.gameMode.interact(mc.player, villager, InteractionHand.MAIN_HAND);
                    actionCooldown = 15;
                    return;
                }
            }
        }

        private void runElytraBot(Minecraft mc) {
            botStatus = "Elytra Scout Active";
            if (mc.player.isFallFlying() && mc.options.keyUp.isDown()) {
                Vec3 look = mc.player.getLookAngle();
                mc.player.setDeltaMovement(mc.player.getDeltaMovement().add(look.scale(0.04)));
            }
        }

        private boolean isOre(Block b) {
            return b == Blocks.COAL_ORE || b == Blocks.DEEPSLATE_COAL_ORE
                    || b == Blocks.IRON_ORE || b == Blocks.DEEPSLATE_IRON_ORE
                    || b == Blocks.COPPER_ORE || b == Blocks.DEEPSLATE_COPPER_ORE
                    || b == Blocks.GOLD_ORE || b == Blocks.DEEPSLATE_GOLD_ORE
                    || b == Blocks.REDSTONE_ORE || b == Blocks.DEEPSLATE_REDSTONE_ORE
                    || b == Blocks.LAPIS_ORE || b == Blocks.DEEPSLATE_LAPIS_ORE
                    || b == Blocks.DIAMOND_ORE || b == Blocks.DEEPSLATE_DIAMOND_ORE
                    || b == Blocks.EMERALD_ORE || b == Blocks.DEEPSLATE_EMERALD_ORE
                    || b == Blocks.NETHER_QUARTZ_ORE || b == Blocks.NETHER_GOLD_ORE
                    || b == Blocks.ANCIENT_DEBRIS;
        }

        private boolean isLog(Block b) {
            return b == Blocks.OAK_LOG || b == Blocks.SPRUCE_LOG || b == Blocks.BIRCH_LOG
                    || b == Blocks.JUNGLE_LOG || b == Blocks.ACACIA_LOG || b == Blocks.DARK_OAK_LOG
                    || b == Blocks.MANGROVE_LOG || b == Blocks.CHERRY_LOG || b == Blocks.CRIMSON_STEM
                    || b == Blocks.WARPED_STEM;
        }

        private boolean selectSlotMatching(Minecraft mc, java.util.function.Predicate<ItemStack> predicate) {
            for (int i = 0; i < 9; i++) {
                ItemStack stack = mc.player.getInventory().getItem(i);
                if (!stack.isEmpty() && predicate.test(stack)) {
                    mc.player.getInventory().setSelectedSlot(i);
                    return true;
                }
            }
            return false;
        }

        private LivingEntity findNearestLiving(Minecraft mc, double maxDist) {
            LivingEntity best = null;
            double bestSq = maxDist * maxDist;
            for (Entity e : mc.level.entitiesForRendering()) {
                if (e instanceof LivingEntity living && e != mc.player && living.isAlive()) {
                    double dSq = mc.player.distanceToSqr(e);
                    if (dSq < bestSq) {
                        bestSq = dSq;
                        best = living;
                    }
                }
            }
            return best;
        }
    }

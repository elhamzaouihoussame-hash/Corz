    package com.hiro.client.config;

    import com.google.gson.Gson;
    import com.google.gson.GsonBuilder;
    import com.hiro.client.HiroClient;
    import com.hiro.client.module.Module;
    import net.fabricmc.loader.api.FabricLoader;

    import java.io.Reader;
    import java.io.Writer;
    import java.nio.charset.StandardCharsets;
    import java.nio.file.Files;
    import java.nio.file.Path;
    import java.util.LinkedHashMap;
    import java.util.Map;

    public class ConfigManager {
        private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
        private static final Path CONFIG_PATH = FabricLoader.getInstance()
                .getConfigDir()
                .resolve("hiroclient.json");

        private static class ConfigData {
            String themeName = "HIRO Noir";
            boolean useDropdownGui = false;
            String schematicPreset = "Bunker 5x5";
            Map<String, Boolean> modules = new LinkedHashMap<>();
        }

        public void load() {
            try {
                if (!Files.exists(CONFIG_PATH)) {
                    save();
                    return;
                }
                try (Reader reader = Files.newBufferedReader(CONFIG_PATH, StandardCharsets.UTF_8)) {
                    ConfigData data = GSON.fromJson(reader, ConfigData.class);
                    if (data == null) return;

                    if (data.themeName != null) {
                        HiroClient.THEME_MANAGER.setThemeByName(data.themeName);
                    }
                    HiroClient.useDropdownGui = data.useDropdownGui;
                    if (data.schematicPreset != null) {
                        HiroClient.SCHEMATIC_ENGINE.setPreset(data.schematicPreset);
                    }
                    if (data.modules != null) {
                        for (Map.Entry<String, Boolean> entry : data.modules.entrySet()) {
                            Module mod = HiroClient.MODULE_MANAGER.getByName(entry.getKey());
                            if (mod != null && entry.getValue() != null) {
                                mod.setEnabled(entry.getValue());
                            }
                        }
                    }
                }
            } catch (Exception e) {
                HiroClient.LOGGER.warn("Failed to load hiroclient.json config", e);
            }
        }

        public void save() {
            try {
                Files.createDirectories(CONFIG_PATH.getParent());
                ConfigData data = new ConfigData();
                data.themeName = HiroClient.THEME_MANAGER.getCurrent().name();
                data.useDropdownGui = HiroClient.useDropdownGui;
                data.schematicPreset = HiroClient.SCHEMATIC_ENGINE.getPreset();
                for (Module mod : HiroClient.MODULE_MANAGER.getModules()) {
                    data.modules.put(mod.getName(), mod.isEnabled());
                }
                try (Writer writer = Files.newBufferedWriter(CONFIG_PATH, StandardCharsets.UTF_8)) {
                    GSON.toJson(data, writer);
                }
            } catch (Exception e) {
                HiroClient.LOGGER.warn("Failed to save hiroclient.json config", e);
            }
        }
    }

    package com.hiro.client.module;

    import net.minecraft.client.Minecraft;
    import net.minecraft.core.BlockPos;
    import net.minecraft.network.chat.Component;
    import net.minecraft.world.InteractionHand;
    import net.minecraft.world.entity.Entity;
    import net.minecraft.world.entity.LivingEntity;
    import net.minecraft.world.entity.player.Player;
    import net.minecraft.world.level.ChunkPos;
    import net.minecraft.world.level.block.entity.BlockEntity;
    import net.minecraft.world.level.block.entity.ChestBlockEntity;
    import net.minecraft.world.level.block.entity.FurnaceBlockEntity;
    import net.minecraft.world.level.block.entity.SpawnerBlockEntity;
    import net.minecraft.world.level.chunk.LevelChunk;
    import net.minecraft.world.phys.EntityHitResult;
    import net.minecraft.world.phys.HitResult;

    import java.util.HashSet;
    import java.util.Set;

    public class ModuleExecutor {
        private final ModuleManager manager;
        private final SchematicEngine schematicEngine;
        private final CombatAndBotEngine combatAndBotEngine;
        private boolean autoJumpHeld = false;
        private int chunkScanCooldown = 0;
        private int afkTickCounter = 0;
        private final Set<Long> alertedChunks = new HashSet<>();

        public ModuleExecutor(ModuleManager manager, SchematicEngine schematicEngine, CombatAndBotEngine combatAndBotEngine) {
            this.manager = manager;
            this.schematicEngine = schematicEngine;
            this.combatAndBotEngine = combatAndBotEngine;
        }

        public void onClientTick(Minecraft mc) {
            if (mc.player == null || mc.level == null) {
                alertedChunks.clear();
                return;
            }

            if (manager.isEnabled("Auto Sprint")) {
                if (mc.options.keyUp.isDown() && !mc.player.isSprinting() && !mc.player.horizontalCollision) {
                    mc.player.setSprinting(true);
                }
            }

            if (manager.isEnabled("Auto Step")) {
                if (mc.player.horizontalCollision && mc.player.onGround()) {
                    mc.player.jumpFromGround();
                }
            }

            if (manager.isEnabled("No Fall")) {
                mc.player.resetFallDistance();
            }

            if (manager.isEnabled("Auto Jump")) {
                boolean moving = mc.options.keyUp.isDown() || mc.options.keyDown.isDown()
                        || mc.options.keyLeft.isDown() || mc.options.keyRight.isDown();
                if (mc.player.onGround() && moving) {
                    mc.options.keyJump.setDown(true);
                    autoJumpHeld = true;
                } else if (autoJumpHeld) {
                    mc.options.keyJump.setDown(false);
                    autoJumpHeld = false;
                }
            } else if (autoJumpHeld) {
                mc.options.keyJump.setDown(false);
                autoJumpHeld = false;
            }

            if (manager.isEnabled("Auto Respawn") && mc.screen != null) {
                if (mc.player.isDeadOrDying()) {
                    mc.player.respawn();
                    mc.setScreen(null);
                }
            }

            if (manager.isEnabled("Trigger Bot") || manager.isEnabled("Sword PvP Bot") || manager.isEnabled("Mace PvP Bot")) {
                HitResult hit = mc.hitResult;
                if (hit != null && hit.getType() == HitResult.Type.ENTITY) {
                    Entity target = ((EntityHitResult) hit).getEntity();
                    if (target instanceof LivingEntity living && living.isAlive() && mc.player.getAttackStrengthScale(0.5f) >= 0.95f) {
                        if (mc.gameMode != null) {
                            mc.gameMode.attack(mc.player, target);
                            mc.player.swing(InteractionHand.MAIN_HAND);
                        }
                    }
                }
            }

            if (manager.isEnabled("Aim Assist") || manager.isEnabled("Crystal PvP Bot")) {
                LivingEntity best = findNearestTarget(mc, 6.0);
                if (best != null) {
                    double dx = best.getX() - mc.player.getX();
                    double dy = (best.getY() + best.getEyeHeight() * 0.75) - mc.player.getEyeY();
                    double dz = best.getZ() - mc.player.getZ();
                    double horizDist = Math.sqrt(dx * dx + dz * dz);

                    float targetYaw = (float) (Math.toDegrees(Math.atan2(-dx, dz)));
                    float targetPitch = (float) (-Math.toDegrees(Math.atan2(dy, horizDist)));

                    mc.player.setYRot(lerpAngle(mc.player.getYRot(), targetYaw, 0.25f));
                    mc.player.setXRot(lerpAngle(mc.player.getXRot(), targetPitch, 0.25f));
                }
            }

            if (manager.isEnabled("Anti AFK")) {
                afkTickCounter++;
                if (afkTickCounter >= 200) {
                    afkTickCounter = 0;
                    mc.player.setYRot(mc.player.getYRot() + 15.0f);
                    if (mc.player.onGround()) {
                        mc.player.jumpFromGround();
                    }
                }
            }

            boolean chunkFinderOn = manager.isEnabled("Chunk Finder");
            boolean susChunkFinderOn = manager.isEnabled("Sus Chunk Finder");
            boolean baseAlertOn = manager.isEnabled("Base Alert");
            boolean deepFinderOn = manager.isEnabled("Deep Player Finder");

            if (chunkFinderOn || susChunkFinderOn || baseAlertOn || deepFinderOn) {
                if (chunkScanCooldown > 0) {
                    chunkScanCooldown--;
                } else {
                    chunkScanCooldown = 20;
                    scanNearbyChunks(mc, susChunkFinderOn, baseAlertOn, deepFinderOn);
                }
            }

            schematicEngine.tick(mc, manager.isEnabled("Schematic Builder"), manager.isEnabled("Builder Bot"));
            combatAndBotEngine.tick(mc, manager);
        }

        private void scanNearbyChunks(Minecraft mc, boolean susMode, boolean baseAlert, boolean deepPlayerFinder) {
            if (deepPlayerFinder) {
                for (Player p : mc.level.players()) {
                    if (p != mc.player && p.isAlive()) {
                        int dist = (int) mc.player.distanceTo(p);
                        mc.player.displayClientMessage(
                                Component.literal("§c[HIRO Player Finder] §f" + p.getName().getString() + " §7at §e" + dist + "m"),
                                true
                        );
                    }
                }
            }

            ChunkPos center = mc.player.chunkPosition();
            int radius = 3;

            for (int dx = -radius; dx <= radius; dx++) {
                for (int dz = -radius; dz <= radius; dz++) {
                    int cx = center.x + dx;
                    int cz = center.z + dz;
                    long key = ChunkPos.asLong(cx, cz);
                    if (alertedChunks.contains(key)) {
                        continue;
                    }

                    LevelChunk chunk = mc.level.getChunkSource().getChunk(cx, cz, false);
                    if (chunk == null) {
                        continue;
                    }

                    int chests = 0;
                    int furnaces = 0;
                    int spawners = 0;

                    for (BlockEntity be : chunk.getBlockEntities().values()) {
                        if (be instanceof ChestBlockEntity) chests++;
                        else if (be instanceof FurnaceBlockEntity) furnaces++;
                        else if (be instanceof SpawnerBlockEntity) spawners++;
                    }

                    int totalActivity = chests + furnaces + spawners;
                    boolean triggered = baseAlert
                            ? (chests + furnaces >= 2)
                            : (susMode ? (totalActivity >= 3 || chests >= 2) : (totalActivity >= 1));

                    if (triggered) {
                        alertedChunks.add(key);
                        BlockPos pos = chunk.getPos().getMiddleBlockPosition(64);
                        String tag = baseAlert ? "Base Alert" : (susMode ? "Sus Chunk" : "Chunk");
                        mc.player.displayClientMessage(
                                Component.literal("§b[HIRO " + tag + "] §f(" + cx + ", " + cz + ") §7XYZ: " + pos.getX() + ", " + pos.getZ() + " §7| Chests: §a" + chests + " §7Furnaces: §6" + furnaces + " §7Spawners: §d" + spawners),
                                false
                        );
                    }
                }
            }
        }

        private LivingEntity findNearestTarget(Minecraft mc, double maxDist) {
            LivingEntity closest = null;
            double bestSq = maxDist * maxDist;

            for (Entity e : mc.level.entitiesForRendering()) {
                if (e instanceof LivingEntity living && e != mc.player && living.isAlive()) {
                    double dSq = mc.player.distanceToSqr(e);
                    if (dSq < bestSq) {
                        bestSq = dSq;
                        closest = living;
                    }
                }
            }
            return closest;
        }

        private float lerpAngle(float current, float target, float factor) {
            float diff = ((target - current + 540f) % 360f) - 180f;
            return current + diff * factor;
        }
    }
